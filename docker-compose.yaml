services:
  # ── Context Broker ────────────────────────────
  orion:
    image: fiware/orion
    container_name: orion
    hostname: orion
    # ports:
    #   - "1026:1026"
    depends_on:
      - mongo
    command:
      -dbURI mongodb://mongo
      -corsOrigin __ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orion.rule=PathPrefix(`/orion`) && PathPrefix(`/v2`)"
      - "traefik.http.routers.orion.entrypoints=web"
      - "traefik.http.routers.orion.middlewares=keycloak-auth,orion-strip"
      - "traefik.http.services.orion.loadbalancer.server.port=1026"
      - "traefik.http.middlewares.orion-strip.stripprefix.prefixes=/orion"
      - "traefik.http.middlewares.keycloak-auth.forwardauth.address=http://jwt-validator:4180"
      - "traefik.http.middlewares.keycloak-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"

    networks:
      - fiware-net

  mongo:
    image: mongo:latest
    container_name: mongo
    hostname: mongo
    # ports:
    #   - "27017:27017"
    volumes:
      - ./mongo:/data/db
    # labels:
    #   - "traefik.enable=true"
    #   # Ruta: http://localhost/mongo/
    #   - "traefik.http.routers.mongo.rule=PathPrefix(`/mongo`)"
    #   - "traefik.http.routers.mongo.entrypoints=web"
    #   - "traefik.http.routers.mongo.middlewares=keycloak-auth,mongo-strip"
    #   - "traefik.http.services.mongo.loadbalancer.server.port=27017"
    #   # Elimina el prefijo /mongo antes de enviar al servicio
    #   - "traefik.http.middlewares.mongo-strip.stripprefix.prefixes=/mongo"

    networks:
      - fiware-net

  cygnus:
    image: fiware/cygnus-ngsi
    hostname: cygnus
    container_name: cygnus
    # ports:
    #   - "5051:5051"
    #   - "5055:5055"
    #   - "5056:5056"
    #   - "5057:5057"
    #   - "5080:5080"
    environment:
      CYGNUS_SERVICE_PORT: 5055
      CYGNUS_POSTGRESQL_SERVICE_PORT: 5055
      CYGNUS_SKIP_CONF_GENERATION: 'true'
      CYGNUS_LOG_LEVEL: INFO
      CYGNUS_POSTGRESQL_HOST: timescale
      CYGNUS_POSTGRESQL_PORT: 5432
      CYGNUS_POSTGRESQL_DATABASE: pamplona
      CYGNUS_POSTGRESQL_USER: admin
      CYGNUS_POSTGRESQL_PASS: admin
      CYGNUS_POSTGRESQL_SERVICE: timescale
      CYGNUS_POSTGRESQL_DATA_MODEL: dm-by-entity-type
      CYGNUS_POSTGRESQL_ATTR_PERSISTENCE: column
    volumes:
      - ./cygnus/agent.conf:/opt/apache-flume/conf/agent.conf:ro
    labels:
      - "traefik.enable=true"
      # Puerto 5080 — API de gestión, protegida con SSO
      - "traefik.http.routers.cygnus.rule=PathPrefix(`/cygnus`)"
      - "traefik.http.routers.cygnus.entrypoints=web"
      - "traefik.http.routers.cygnus.middlewares=keycloak-auth,cygnus-strip"
      - "traefik.http.services.cygnus.loadbalancer.server.port=5080"
      - "traefik.http.middlewares.cygnus-strip.stripprefix.prefixes=/cygnus"
    networks:
      - fiware-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8088:80"
    networks:
      - fiware-net

  iot-agent-json:
    image: fiware/iotagent-json
    hostname: iot-agent-json
    container_name: iot-agent-json
    restart: always
    depends_on:
      - mongo
    environment:
      IOTA_CB_HOST: orion
      IOTA_CB_PORT: 1026
      IOTA_NORTH_PORT: 4041
      IOTA_REGISTRY_TYPE: mongo
      IOTA_LOG_LEVEL: DEBUG
      IOTA_CB_NGSI_VERSION: v2
      IOTA_MONGO_HOST: mongo
      IOTA_MONGO_PORT: 27017
      IOTA_MONGO_DB: orion
      IOTA_HTTP_PORT: 7896
      IOTA_PROVIDER_URL: http://iot-agent-json:4041
      IOTA_DEFAULT_RESOURCE: /iot/json
    # ports:
    #   - "4041:4041"
    #   - "7896:7896"
    labels:
      - "traefik.enable=true"
      # API northbound del IoT Agent - puerto 4041
      - "traefik.http.routers.iot-json-admin.rule=PathPrefix(`/iot-json-admin`)"
      - "traefik.http.routers.iot-json-admin.entrypoints=web"
      - "traefik.http.routers.iot-json-admin.middlewares=keycloak-auth,iot-json-admin-strip"
      - "traefik.http.routers.iot-json-admin.service=iot-json-admin"
      - "traefik.http.services.iot-json-admin.loadbalancer.server.port=4041"
      - "traefik.http.middlewares.iot-json-admin-strip.stripprefix.prefixes=/iot-json-admin"
      # Endpoint HTTP para dispositivos - puerto 7896
      - "traefik.http.routers.iot-json.rule=PathPrefix(`/iot-json`)"
      - "traefik.http.routers.iot-json.entrypoints=web"
      - "traefik.http.routers.iot-json.middlewares=keycloak-auth,iot-json-strip"
      - "traefik.http.routers.iot-json.service=iot-json"
      - "traefik.http.services.iot-json.loadbalancer.server.port=7896"
      - "traefik.http.middlewares.iot-json-strip.stripprefix.prefixes=/iot-json"
    networks:
      - fiware-net

  fastapi:
    hostname: fastapi
    container_name: fastapi
    build:
      context: .
      dockerfile: dockerfile_fastapi
    # ports:
    #   - "8000:8000"
    labels:
      - "traefik.enable=true"
      # Ruta: http://localhost/api/
      - "traefik.http.routers.fastapi.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.fastapi.entrypoints=web"
      - "traefik.http.routers.fastapi.middlewares=keycloak-auth,fastapi-strip"
      - "traefik.http.services.fastapi.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.fastapi-strip.stripprefix.prefixes=/api"
    networks:
      - fiware-net

  # ── Nginx Web (tu app web) ─────────────────────
  nginx_server:
    hostname: nginx
    container_name: nginx
    build:
      context: .
      dockerfile: dockerfile_nginx
    ports:
      - "89:80"
    labels:
      - "traefik.enable=true"
      # Ruta: http://localhost/web/
      - "traefik.http.routers.nginx-web.rule=PathPrefix(`/web`)"
      - "traefik.http.routers.nginx-web.entrypoints=web"
      - "traefik.http.routers.nginx-web.middlewares=nginx-strip"
      - "traefik.http.services.nginx-web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.nginx-strip.stripprefix.prefixes=/web"
    networks:
      - fiware-net

  # ── TimescaleDB ───────────────────────────────
  timescale:
    image: timescale/timescaledb-ha:pg16-ts2.17-all
    container_name: timescale
    hostname: timescale
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pamplona
      PGDATA: /home/postgres/pgdata
    
    volumes:
      - ./postgis:/home/postgres/pgdata
      - ./timescale-init/init-db-keycloak.sql:/docker-entrypoint-initdb.d/init-db-keycloak.sql:ro
    user: "0:0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fiware-net


  # -- ------------- Seguridad y SSO ─────────────────────────────
  # ── Identity Manager ──────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    hostname: keycloak
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: timescale
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: pamplona
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      - timescale
    command: start-dev
    volumes:
      - ./keycloak-data:/opt/keycloak/data
    networks:
      - fiware-net

  # ── Traefik (reverse proxy) ───────────────────
  traefik:
    image: traefik:v3.7.0
    container_name: traefik
    hostname: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fiware-net
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "81:80"      # Punto de entrada de todas las apps
      - "8090:8080"  # Dashboard de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fiware-net

  # ── PEP Proxy ─────────────────────────────────
  # oauth2-proxy actúa como middleware forwardAuth de Traefik.
  # Traefik pregunta a oauth2-proxy si la petición está autenticada
  # antes de enrutarla al servicio destino. Si no lo está, redirige
  # automáticamente al login de Keycloak.

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    hostname: oauth2-proxy
    command: >
      --provider=keycloak-oidc
      --client-id=fiware-client
      --client-secret=mRDyxY3deeW9WChqjiKsGvhtHj9iHHe1
      --oidc-issuer-url=http://keycloak:8080/realms/fiware
      --upstream=static://200
      --http-address=0.0.0.0:4180
      --skip-provider-button=true
      --email-domain="*"
      --skip-jwt-bearer-tokens=true
      --oidc-extra-audience=account
      --oidc-email-claim=sub

      --cookie-secret=mHBltNpc++gK92n7NEQLQw==

      --pass-authorization-header=true
      --insecure-oidc-allow-unverified-email=true
      --insecure-oidc-skip-issuer-verification=true
    ports:
      - "4180:4180"
    labels:
      - "traefik.enable=true"
      # Ruta del callback OAuth2 (necesaria para el flujo de login)
      - "traefik.http.routers.oauth2-proxy.rule=PathPrefix(`/oauth2`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=web"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      # Middleware forwardAuth que usan todos los servicios protegidos
      - "traefik.http.middlewares.keycloak-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.keycloak-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.keycloak-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,Authorization"
    depends_on:
      - keycloak
    restart: always
    networks:
      - fiware-net

  
  #────── Apisix Proxy ───────────────────────────────
  apisix:
    image: apache/apisix:3.16.0-ubuntu
    hostname: apisix
    container_name: apisix
    restart: always
    
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9092:9092/tcp"
    networks:
      - fiware-net
  
  etcd:
    image: bitnamilegacy/etcd:3.5.11
    container_name: etcd
    hostname: etcd
    restart: always
    volumes:
      - ./etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379/tcp"
    networks:
      - fiware-net

volumes:
  mongo_data:

networks:
  fiware-net:
    external: true