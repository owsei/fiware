services:
  #  ─────────────────────────────── FIWARE Services ───────────────────────────────  #
  # ── Context Broker (Orion) ─────────────────────────
  orion:
    image: fiware/orion
    container_name: orion
    hostname: orion
    # ports:
    #   - "1026:1026"
    depends_on:
      - mongo
    command: 
      -dbURI mongodb://mongo
      -corsOrigin __ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orion.rule=PathPrefix(`/orion`) && PathPrefix(`/v2`)"
      - "traefik.http.routers.orion.entrypoints=web"
      - "traefik.http.routers.orion.middlewares=keycloak-auth,orion-strip"
      - "traefik.http.services.orion.loadbalancer.server.port=1026"
      - "traefik.http.middlewares.orion-strip.stripprefix.prefixes=/orion"
      - "traefik.http.middlewares.keycloak-auth.forwardauth.address=http://jwt-validator:4180"
      - "traefik.http.middlewares.keycloak-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"

    networks:
      - fiware

  # ── Database (MongoDB) ─────────────────────────
  mongo:
    image: mongo:5
    container_name: mongo
    hostname: mongo
    # ports:
    #   - "27017:27017"
    # command: --nojournal
    volumes:
      - mongo_data:/data/db
    networks:
      - fiware
  
  # ── IoT Agent (JSON) ─────────────────────────
  iot-agent-json:
    image: fiware/iotagent-json:3.13.0
    hostname: iot-agent-json
    container_name: iot-agent-json
    # restart: always
    depends_on:
      - mongo
    environment:
      IOTA_CB_HOST : orion
      IOTA_CB_PORT : 1026
      IOTA_NORTH_PORT: 4041
      IOTA_REGISTRY_TYPE: mongodb
      IOTA_LOG_LEVEL: DEBUG
      # IOTA_TIMESTAMP: true
      IOTA_CB_NGSI_VERSION: v2
      # IOTA_AUTOCAST: true
      IOTA_MONGO_HOST: mongo
      IOTA_MONGO_PORT: 27017
      IOTA_MONGO_DB: orion
      IOTA_HTTP_PORT: 7896
      IOTA_PROVIDER_URL: http://iot-agent-json:4041
      IOTA_DEFAULT_RESOURCE: /iot/json
    ports:
      - "4041:4041"
      - "7896:7896"
    labels:
      - "traefik.enable=true"
      # Ruta: http://localhost/iot-json/
      - "traefik.http.routers.iot-json.rule=PathPrefix(`/iot-json`)"
      - "traefik.http.routers.iot-json.entrypoints=web" 
      - "traefik.http.routers.iot-json.middlewares=keycloak-auth,iot-json-strip"
      - "traefik.http.services.iot-json.loadbalancer.server.port=4041,7896"
       # Elimina el prefijo /iot-json antes de enviar al servicio 
      - "traefik.http.middlewares.iot-json-strip.stripprefix.prefixes=/iot-json"

   
    networks:
      - fiware

  # ── Data Persistence (Cygnus) ─────────────────────────
  cygnus:
    image: fiware/cygnus-ngsi
    hostname: cygnus
    container_name: cygnus
    # build:
    #   context: .
    #   dockerfile: dockerfile_cygnus
    # depends_on:
    #   - postgis
    ports:
      - "5051:5051"
      - "5055:5055"
      - "5056:5056"
      - "5080:5080" 
    environment:
      CYGNUS_SERVICE_PORT: 5055
      CYGNUS_POSTGRESQL_SERVICE_PORT: 5055
      # PostgreSQL config
      CYGNUS_SKIP_CONF_GENERATION: true
      CYGNUS_LOG_LEVEL: INFO
      CYGNUS_POSTGRESQL_HOST: timescale
      CYGNUS_POSTGRESQL_PORT: 5432
      CYGNUS_POSTGRESQL_DATABASE: geopamplona
      CYGNUS_POSTGRESQL_USER: admin
      CYGNUS_POSTGRESQL_PASS: admin
      CYGNUS_POSTGRESQL_SERVICE: timescale
      CYGNUS_POSTGRESQL_DATA_MODEL: dm-by-entity-type #dm-by-entity-type-database #dm-by-entity-type-database #dm-by-entity-type-database
      CYGNUS_POSTGRESQL_ATTR_PERSISTENCE: column
      
      # CYGNUS_MYSQL_HOST : mysql
      # CYGNUS_MYSQL_DB : orion
      # CYGNUS_MYSQL_PORT : 3306
      # CYGNUS_MYSQL_USER : root
      # CYGNUS_MYSQL_PASS : 6447
      # CYGNUS_MYSQL_DATA_MODEL : dm-by-entity-type
      # CYGNUS_MYSQL_ATTR_PERSISTENCE: column
      # CYGNUS_MYSQL_SERVICE_PORT : 5050
    volumes:
      - ./cygnus/agent.conf:/opt/apache-flume/conf/agent.conf:ro
    networks:
      - fiware
  
  # ────────────────────────────────── Other Services (TimescaleDB, pgAdmin, FastAPI, Nginx, Keycloak, OAuth2 Proxy) ─────────────────────── #
  # ── Time-Series Database (TimescaleDB) ─────────────────────────
  timescale:
    image: timescale/timescaledb-ha:pg16-ts2.17-all
    container_name: timescale
    hostname: timescale
    environment:
      POSTGRES_DB: pamplona
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /home/postgres/pgdata/data
    # ports:
    #   - "5432:5432"
    volumes:
      - ./timescaledb:/home/postgres/pgdata
      - ./timescale/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql:ro
    user: "0:0"
    # restart: unless-stopped
    networks:
      - fiware
  
  # ── Database Administration (pgAdmin) ─────────────────────────
  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8086:80"
    depends_on:
      - timescale
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin

    networks:
      - fiware

  # ── API Service (FastAPI) ─────────────────────────
  fastapi:
    hostname: fastapi
    container_name: fastapi
    build:
      context: .
      dockerfile: dockerfile_fastapi
    # depends_on:
    #   - postgis
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      # Ruta: http://localhost/api/
      - "traefik.http.routers.fastapi.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.fastapi.entrypoints=web"
      - "traefik.http.routers.fastapi.middlewares=keycloak-auth,fastapi-strip"
      - "traefik.http.services.fastapi.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.fastapi-strip.stripprefix.prefixes=/api"
    networks:
      - fiware
  
  # ── Web Server (Nginx) ─────────────────────────
  nginx_server:
    hostname: nginx
    container_name: nginx
    build:
      context: .
      dockerfile: dockerfile_nginx
    ports:
      - "82:80"
    depends_on:
      - fastapi
    networks:
      - fiware

  # ──────────────────────────────────────────── SECURITY SERVICES ─────────────────────────────── #
  # ── Identity Manager ──────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    hostname: keycloak
    ports:
      - "8085:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: timescale
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: pamplona
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - timescale
    command: start-dev
    volumes:
      - ./keycloak-data:/opt/keycloak/data
    networks:
      -  fiware

   # ── PEP Proxy (Wilma) ─────────────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    hostname: oauth2-proxy
    ports:
      - "1027:4180"
    command: >
      --provider=keycloak-oidc
      --client-id=fiware-client
      --client-secret=zSLClriNmcTC7OUd7WUxphb0tufJH2Pg
      --oidc-issuer-url=http://keycloak:8080/realms/fiware
      --upstream=static://200
      --http-address=0.0.0.0:4180
      --skip-provider-button=true
      --email-domain="*"
      --skip-jwt-bearer-tokens=true
      --oidc-extra-audience=account
      --oidc-email-claim=sub

      --cookie-secret=mHBltNpc++gK92n7NEQLQw==
      
      --pass-authorization-header=true
      --insecure-oidc-allow-unverified-email=true
      --insecure-oidc-skip-issuer-verification=true
    networks:
      -  fiware

   # ── Traefik (reverse proxy) ───────────────────
  traefik:
    image: traefik:v3.7.0
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:81"
    ports:
      - "81:80"      # Punto de entrada de todas las apps
      - "8090:8080"  # Dashboard de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - oauth2-proxy
    networks:
      - fiware

volumes:
  mongo_data:

networks:
  fiware:
    driver: bridge